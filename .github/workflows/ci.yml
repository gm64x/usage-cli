name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Check gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests (Ubuntu with race detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: go test ./...

      - name: Run golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64

      - name: Cross-compile windows/amd64 and linux/amd64
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/usage-cli-windows-amd64.exe ./cmd/usage-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/usage-cli-linux-amd64 ./cmd/usage-cli
