name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build release binaries and checksums
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/gm64x/usage-cli/internal/cli.Version=${VERSION} -X github.com/gm64x/usage-cli/internal/cli.Commit=${COMMIT} -X github.com/gm64x/usage-cli/internal/cli.Date=${DATE}"

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/usage-cli-windows-amd64.exe ./cmd/usage-cli
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/usage-cli-windows-arm64.exe ./cmd/usage-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/usage-cli-linux-amd64 ./cmd/usage-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/usage-cli-linux-arm64 ./cmd/usage-cli

          (cd dist && sha256sum usage-cli-* > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/usage-cli-windows-amd64.exe
            dist/usage-cli-windows-arm64.exe
            dist/usage-cli-linux-amd64
            dist/usage-cli-linux-arm64
            dist/SHA256SUMS.txt
          generate_release_notes: true
