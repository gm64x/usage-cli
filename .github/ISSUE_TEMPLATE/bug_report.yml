name: Bug Report
description: Report a bug or unexpected behavior in usage-cli
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please ensure you redact any API keys, session tokens, or private paths before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear summary of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Commands, flags, or configuration used to reproduce the behavior.
      placeholder: |
        1. Run `usage-cli ...`
        2. Observe output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What you expected to happen versus what actually happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: usage-cli Version
      description: Output of `usage-cli version --json`.
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System / Environment
      options:
        - Windows 11 (native)
        - Windows + WSL2
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Command Output
      description: Relevant redacted terminal output or error messages.
      render: shell
